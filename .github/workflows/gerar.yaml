name: Gerar Bom dia, Varejo

on:
  repository_dispatch:          # disparado pelo Atalho do iPhone
    types: [gerar]
  workflow_dispatch:            # alternativa: botão "Run workflow" no app do GitHub
    inputs:
      roteiro:
        description: "JSON do roteiro (vídeo ou stories)"
        required: true
      categoria:
        description: "Tipo do conteúdo"
        type: choice
        options: [noticia, curiosidade]
        default: noticia

permissions:
  contents: write               # necessário para criar a release com os arquivos

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Fontes Arial e Georgia (mesmo visual do Windows)
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo apt-get install -y -qq ttf-mscorefonts-installer || echo "Fontes MS indisponíveis; usando DejaVu."
          mkdir -p ~/.fonts
          curl -fsSL -o /tmp/selawik.zip \
            https://github.com/microsoft/Selawik/releases/download/1.01/Selawik_Release.zip \
            && unzip -oj /tmp/selawik.zip selawk.ttf selawkb.ttf -d ~/.fonts \
            || echo "Selawik indisponível; usando Arial."
          curl -fsSL -o ~/.fonts/NewsCycle-Bold.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/newscycle/NewsCycle-Bold.ttf \
            || echo "News Cycle indisponível; usando Arial Bold."

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Salvar o roteiro recebido
        env:
          ROTEIRO: ${{ github.event.client_payload.roteiro || inputs.roteiro }}
        run: printf '%s' "$ROTEIRO" > roteiro.json

      - name: Gerar vídeo ou stories
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CATEGORIA: ${{ github.event.client_payload.categoria || inputs.categoria || 'noticia' }}
        run: python gera-video.py roteiro.json --categoria "$CATEGORIA" --saida saida

      - name: Publicar como release (o Atalho baixa daqui)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          arquivos=(saida/*.mp4 saida/*.jpg saida/*.png)
          if [ ${#arquivos[@]} -eq 0 ]; then echo "Nenhum arquivo gerado."; exit 1; fi
          notas=(saida/*_legendas.txt)
          if [ ${#notas[@]} -gt 0 ]; then cat "${notas[@]}" > notas.txt; else : > notas.txt; fi
          TAG="bdv-$(date +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}"
          gh release create "$TAG" "${arquivos[@]}" --title "$(basename "${arquivos[0]%.*}")" --notes-file notas.txt

      - name: Avisar no iPhone (ntfy)
        if: always() && env.NTFY_TOPIC != ''
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            curl -s -H "Title: Bom dia, Varejo" -H "Tags: white_check_mark" \
              -H "Click: shortcuts://run-shortcut?name=Baixar%20Bom%20Dia%2C%20Varejo" \
              -d "Pronto! Toque aqui para baixar." "https://ntfy.sh/$NTFY_TOPIC"
          else
            curl -s -H "Title: Bom dia, Varejo" -H "Tags: x" -H "Priority: high" \
              -H "Click: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              -d "Falhou. Toque para ver o erro." "https://ntfy.sh/$NTFY_TOPIC"
          fi
